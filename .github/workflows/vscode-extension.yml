name: VS Code Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-vs-code-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language-server/slang-lang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npm run compile
      - name: Package extension
        run: npx @vscode/vsce package
      - name: Store VSIX as artifact
        uses: actions/upload-artifact@v7
        with:
          path: "language-server/slang-lang/*.vsix"
